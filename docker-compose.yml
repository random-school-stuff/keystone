services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      WISP_STREAM_LIMIT: "${WISP_STREAM_LIMIT:-200}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-127.0.0.1,::1}"
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env first}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
